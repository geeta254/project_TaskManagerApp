<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1450px;
            margin: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 34px;
            font-weight: 700;
        }

        .back-btn {
            text-decoration: none;
            background: #2563eb;
            padding: 12px 22px;
            border-radius: 10px;
            color: white;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #1d4ed8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0px 5px 25px rgba(0,0,0,0.3);
        }

        .card h3 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #60a5fa;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            background: #334155;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input::placeholder {
            color: #cbd5e1;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .table-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 18px;
            overflow-x: auto;
        }

        .table-card h3 {
            margin-bottom: 20px;
            color: #60a5fa;
            font-size: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #334155;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
        }

        th {
            color: #93c5fd;
            font-size: 15px;
        }

        tbody tr {
            border-bottom: 1px solid #334155;
        }

        tbody tr:hover {
            background: #273449;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .update-btn {
            background: #16a34a;
        }

        .update-btn:hover {
            background: #15803d;
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .status {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            display: inline-block;
            font-weight: 600;
        }

        .pending {
            background: orange;
            color: black;
        }

        .completed {
            background: #16a34a;
        }

        .in_progress {
            background: #2563eb;
        }

        @media(max-width:768px) {

            body {
                padding: 15px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            table {
                min-width: 1000px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- TOPBAR -->
    <div class="topbar">

        <h1>Admin Dashboard</h1>

        <a href="/" class="back-btn">
            ← Back To Home
        </a>

    </div>

    <!-- GRID -->
    <div class="grid">

        <!-- CREATE EMPLOYEE -->
        <div class="card">

            <h3>Create Employee</h3>

            <input id="emp_username"
                placeholder="Employee Username">

            <input id="emp_password"
                type="password"
                placeholder="Employee Password">

            <button onclick="createEmployee()">
                Create Employee
            </button>

        </div>

        <!-- CREATE PROJECT -->
        <div class="card">

            <h3>Create Project</h3>

            <input id="projectName"
                placeholder="Project Name">

            <input id="projectDesc"
                placeholder="Project Description">

            <button onclick="createProject()">
                Create Project
            </button>

        </div>

        <!-- TASK -->
        <div class="card">

            <h3>Create / Update Task</h3>

            <select id="employeeSelect"></select>

            <select id="projectSelect"></select>

            <input id="taskTitle"
                placeholder="Task Title">

            <input id="taskDesc"
                placeholder="Task Description">

            <input id="taskDue"
                type="date">

            <button id="taskBtn"
                onclick="saveTask()">
                Assign Task
            </button>

        </div>

    </div>

    <!-- TABLE -->
    <div class="table-card">

        <h3>All Tasks</h3>

        <table>

            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th>Project</th>
                    <th>Assigned To</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="taskTable"></tbody>

        </table>

    </div>

</div>

<script>

let editId = null;


/* ================= CREATE EMPLOYEE ================= */
function createEmployee() {

    fetch("/api/register/", {

        method: "POST",

        headers: {
            "Content-Type":"application/json"
        },

        body: JSON.stringify({

            username: document.getElementById("emp_username").value,

            password: document.getElementById("emp_password").value,

            role: "employee"
        })
    })

    .then(res => res.json())

    .then(data => {

        alert("Employee Created Successfully");

        document.getElementById("emp_username").value = "";
        document.getElementById("emp_password").value = "";

        loadEmployees();
    });
}


/* ================= CREATE PROJECT ================= */
function createProject() {

    fetch("/api/projects/", {

        method: "POST",

        headers: {
            "Content-Type":"application/json",
            "Authorization":"Bearer " + localStorage.getItem("token")
        },

        body: JSON.stringify({

            name: document.getElementById("projectName").value,

            description: document.getElementById("projectDesc").value
        })
    })

    .then(res => res.json())

    .then(data => {

        alert("Project Created Successfully");

        document.getElementById("projectName").value = "";
        document.getElementById("projectDesc").value = "";

        loadProjects();
    });
}


/* ================= LOAD EMPLOYEES ================= */
function loadEmployees() {

    fetch("/api/employees/", {

        headers: {
            "Authorization":"Bearer " + localStorage.getItem("token")
        }
    })

    .then(res => res.json())

    .then(data => {

        let select = document.getElementById("employeeSelect");

        select.innerHTML = "";

        data.forEach(employee => {

            select.innerHTML += `
                <option value="${employee.id}">
                    ${employee.username}
                </option>
            `;
        });
    });
}


/* ================= LOAD PROJECTS ================= */
function loadProjects() {

    fetch("/api/projects/", {

        headers: {
            "Authorization":"Bearer " + localStorage.getItem("token")
        }
    })

    .then(res => res.json())

    .then(data => {

        let select = document.getElementById("projectSelect");

        select.innerHTML = "";

        data.forEach(project => {

            select.innerHTML += `
                <option value="${project.id}">
                    ${project.name}
                </option>
            `;
        });
    });
}


/* ================= LOAD TASKS ================= */
function loadTasks() {

    fetch("/api/tasks/", {

        headers: {
            "Authorization":"Bearer " + localStorage.getItem("token")
        }
    })

    .then(res => res.json())

    .then(data => {

        let table = document.getElementById("taskTable");

        table.innerHTML = "";

        data.forEach(task => {

            table.innerHTML += `

                <tr>

                    <td>${task.title}</td>

                    <td>${task.description || "-"}</td>

                    <td>
                        ${task.due_date
                            ? task.due_date.split("T")[0]
                            : "-"
                        }
                    </td>

                    <td>
                        <span class="status ${task.status}">
                            ${task.status}
                        </span>
                    </td>

                    <td>${task.project || "-"}</td>

                    <td>${task.assigned_to_name || "-"}</td>

                    <td>

                        <div class="action-btns">

                            <button class="update-btn"

                                onclick="editTask(
                                    ${task.id},
                                    '${task.title}',
                                    '${task.description || ""}',
                                    '${task.due_date
                                        ? task.due_date.split("T")[0]
                                        : ""
                                    }'
                                )">

                                Update

                            </button>

                            <button class="delete-btn"
                                onclick="deleteTask(${task.id})">

                                Delete

                            </button>

                        </div>

                    </td>

                </tr>
            `;
        });
    });
}


/* ================= EDIT TASK ================= */
function editTask(id, title, description, due_date) {

    editId = id;

    document.getElementById("taskTitle").value = title;

    document.getElementById("taskDesc").value = description;

    document.getElementById("taskDue").value = due_date;

    document.getElementById("taskBtn").innerText = "Update Task";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ================= SAVE TASK ================= */
function saveTask() {

    let url = "/api/tasks/";
    let method = "POST";

    // UPDATE
    if(editId){

        url = `/api/tasks/${editId}/`;
        method = "PUT";
    }

    fetch(url, {

        method: method,

        headers: {
            "Content-Type":"application/json",
            "Authorization":"Bearer " + localStorage.getItem("token")
        },

        body: JSON.stringify({

            title: document.getElementById("taskTitle").value,

            description: document.getElementById("taskDesc").value,

            due_date: document.getElementById("taskDue").value,

            assigned_to: document.getElementById("employeeSelect").value,

            project: document.getElementById("projectSelect").value
        })
    })

    .then(res => res.json())

    .then(data => {

        if(editId){
            alert("Task Updated Successfully");
        }
        else{
            alert("Task Assigned Successfully");
        }

        document.getElementById("taskTitle").value = "";
        document.getElementById("taskDesc").value = "";
        document.getElementById("taskDue").value = "";

        document.getElementById("taskBtn").innerText = "Assign Task";

        editId = null;

        loadTasks();
    });
}


/* ================= DELETE TASK ================= */
function deleteTask(id) {

    if(!confirm("Are you sure you want to delete this task?")){
        return;
    }

    fetch(`/api/tasks/${id}/`, {

        method: "DELETE",

        headers: {
            "Authorization":"Bearer " + localStorage.getItem("token")
        }
    })

    .then(() => {

        alert("Task Deleted Successfully");

        loadTasks();
    });
}


/* ================= INIT ================= */
loadEmployees();
loadProjects();
loadTasks();

</script>

</body>
</html>
