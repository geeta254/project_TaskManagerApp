<!DOCTYPE html>
<html>
<head>
<title>Register - Task Manager</title>

<style>
/* same UI (unchanged - already good) */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    display: flex;
    height: 100vh;
}

/* LEFT */
.left {
    flex: 1;
    background: linear-gradient(135deg, #06b6d4, #4f46e5);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
}

.left h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.left p {
    font-size: 16px;
    opacity: 0.9;
    line-height: 1.6;
}

/* RIGHT */
.right {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f7fb;
}

.box {
    width: 360px;
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}

label {
    font-size: 13px;
    margin-top: 12px;
    display: block;
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #3730a3;
}

/* TOAST */
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 18px;
    border-radius: 10px;
    color: white;
    font-size: 13px;
    opacity: 0;
    transform: translateY(-20px);
    transition: 0.3s;
    z-index: 9999;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

.toast.success {
    background: #22c55e;
}

.toast.error {
    background: #ef4444;
}
</style>
</head>

<body>

<div class="left">
    <h1>Join Task Manager</h1>
    <p>Create an account to manage tasks and collaborate with your team.</p>
</div>

<div class="right">
<div class="box">

<h2>Create Account</h2>

<label>Username</label>
<input type="text" id="username">

<label>Password</label>
<input type="password" id="password">

<label>Role</label>
<select id="role">
    <option value="employee">Employee</option>
    <option value="admin">Admin</option>
</select>

<button onclick="registerUser()">Register</button>

</div>
</div>

<div id="toast" class="toast"></div>

<script>

function showToast(message, type) {
    let toast = document.getElementById("toast");
    toast.innerText = message;
    toast.className = "toast show " + type;

    setTimeout(() => {
        toast.className = "toast";
    }, 2500);
}

function registerUser() {

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let role = document.getElementById("role").value;

    fetch("/api/register/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password,
            role: role
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.message) {
            showToast("Registration Successful 🎉", "success");

            setTimeout(() => {
                window.location.href = "/login/";
            }, 1200);

        } else {
            showToast(data.error || "Registration Failed ❌", "error");
        }

    })
    .catch(() => {
        showToast("Server Error ⚠️", "error");
    });
}

</script>

</body>
</html>
