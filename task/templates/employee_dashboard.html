<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    background:
    linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b
    );

    min-height:100vh;
    padding:25px;
    color:white;
}

/* ================= CONTAINER ================= */
.container{
    max-width:1400px;
    margin:auto;
}

/* ================= TOPBAR ================= */
.topbar{
    background:#1e293b;
    padding:18px 25px;
    border-radius:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:30px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
}

.topbar h2{
    font-size:30px;
    font-weight:700;
    color:#60a5fa;
}

.home-btn{
    text-decoration:none;
    background:#2563eb;
    color:white;

    padding:12px 22px;
    border-radius:10px;

    font-weight:600;
    transition:0.3s;
}

.home-btn:hover{
    background:#1d4ed8;
}

/* ================= STATS ================= */
.stats{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;

    margin-bottom:30px;
}

.stat-card{
    background:#1e293b;
    padding:25px;
    border-radius:18px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
}

.stat-card h3{
    font-size:16px;
    color:#cbd5e1;
    margin-bottom:10px;
}

.stat-card p{
    font-size:32px;
    font-weight:700;
}

/* ================= TASK GRID ================= */
.grid{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

    gap:22px;
}

/* ================= TASK CARD ================= */
.card{
    background:#1e293b;

    padding:22px;

    border-radius:20px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.25);

    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.title{
    font-size:22px;
    font-weight:700;
    margin-bottom:10px;
}

.desc{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:15px;
    line-height:1.6;
}

/* ================= STATUS ================= */
.status{
    display:inline-block;

    padding:7px 14px;

    border-radius:30px;

    font-size:12px;
    font-weight:700;

    margin-bottom:15px;
}

.pending{
    background:#facc15;
    color:black;
}

.in_progress{
    background:#3b82f6;
    color:white;
}

.completed{
    background:#10b981;
    color:white;
}

/* ================= INFO ================= */
.info{
    font-size:14px;
    color:#cbd5e1;

    margin-bottom:8px;
}

/* ================= BUTTONS ================= */
button{
    width:100%;

    border:none;

    padding:12px;

    border-radius:12px;

    font-size:14px;
    font-weight:600;

    cursor:pointer;

    transition:0.3s;

    margin-top:10px;
}

.start-btn{
    background:#2563eb;
    color:white;
}

.start-btn:hover{
    background:#1d4ed8;
}

.done-btn{
    background:#10b981;
    color:white;
}

.done-btn:hover{
    background:#059669;
}

.completed-text{
    margin-top:14px;
    color:#10b981;
    font-weight:700;
    text-align:center;
}

/* ================= EMPTY ================= */
.empty{
    text-align:center;
    margin-top:80px;
    color:#94a3b8;
    font-size:18px;
}

/* ================= MOBILE ================= */
@media(max-width:768px){

    body{
        padding:15px;
    }

    .topbar{
        flex-direction:column;
        gap:20px;
        align-items:flex-start;
    }

    .topbar h2{
        font-size:24px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- ================= TOPBAR ================= -->
    <div class="topbar">

        <h2>📋 Employee Dashboard</h2>

        <a href="/" class="home-btn">
            ← Back To Home
        </a>

    </div>

    <!-- ================= STATS ================= -->
    <div class="stats">

        <div class="stat-card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <p id="progressTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
        </div>

    </div>

    <!-- ================= TASKS ================= -->
    <div id="tasks" class="grid"></div>

    <p id="empty" class="empty"></p>

</div>

<script>

const token = localStorage.getItem("token");

/* ================= LOGIN CHECK ================= */
if(!token){

    document.getElementById("empty").innerText =
    "⚠️ Please Login First";
}


/* ================= LOAD TASKS ================= */
function loadTasks(){

    fetch("/api/tasks/",{

        headers:{
            "Authorization":"Bearer " + token
        }
    })

    .then(res => {

        if(!res.ok){
            throw new Error("Unauthorized");
        }

        return res.json();
    })

    .then(data => {

        const container =
        document.getElementById("tasks");

        const empty =
        document.getElementById("empty");

        container.innerHTML = "";

        /* ================= COUNTS ================= */

        let total = data.length;

        let pending = 0;
        let progress = 0;
        let completed = 0;

        data.forEach(task => {

            if(task.status === "pending"){
                pending++;
            }

            else if(task.status === "in_progress"){
                progress++;
            }

            else if(task.status === "completed"){
                completed++;
            }
        });

        document.getElementById("totalTasks").innerText =
        total;

        document.getElementById("pendingTasks").innerText =
        pending;

        document.getElementById("progressTasks").innerText =
        progress;

        document.getElementById("completedTasks").innerText =
        completed;

        /* ================= EMPTY ================= */

        if(data.length === 0){

            empty.innerText =
            "🚫 No Tasks Assigned";

            return;
        }

        empty.innerText = "";

        /* ================= TASK CARDS ================= */

        data.forEach(task => {

            container.innerHTML += `

            <div class="card">

                <div class="title">
                    ${task.title}
                </div>

                <div class="desc">
                    ${task.description || "No Description"}
                </div>

                <div class="status ${task.status}">
                    ${task.status.replace("_"," ")}
                </div>

                <div class="info">
                    📅 Due:
                    ${
                        task.due_date
                        ?
                        task.due_date.split("T")[0]
                        :
                        "Not Set"
                    }
                </div>

                <div class="info">
                    📁 Project:
                    ${task.project || "N/A"}
                </div>

                ${
                    task.status === "pending"

                    ?

                    `
                    <button
                        class="start-btn"

                        onclick="
                        updateStatus(
                            ${task.id},
                            'in_progress'
                        )">

                        ▶ Start Task

                    </button>
                    `

                    :

                    ""
                }

                ${
                    task.status !== "completed"

                    ?

                    `
                    <button
                        class="done-btn"

                        onclick="
                        updateStatus(
                            ${task.id},
                            'completed'
                        )">

                        ✔ Complete Task

                    </button>
                    `

                    :

                    `
                    <div class="completed-text">
                        🎉 Task Completed
                    </div>
                    `
                }

            </div>

            `;
        });
    })

    .catch(error => {

        console.log(error);

        document.getElementById("empty").innerText =
        "❌ Error Loading Tasks";
    });
}


/* ================= UPDATE STATUS ================= */
function updateStatus(id,status){

    fetch(`/api/tasks/${id}/`,{

        method:"PATCH",

        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },

        body:JSON.stringify({
            status:status
        })
    })

    .then(res => {

        if(!res.ok){
            throw new Error("Update Failed");
        }

        return res.json();
    })

    .then(data => {

        loadTasks();
    })

    .catch(error => {

        alert("Status Update Failed");

        console.log(error);
    });
}


/* ================= INIT ================= */
loadTasks();

</script>

</body>
</html>
